          <button id="cvm-locale-toggle" type="button" aria-label="Switch website language">العربية</button>
          <script>
          (function(){
            const translations = ${payload};
            const key='cvm_site_language';
            const saved=localStorage.getItem(key);
            let lang=saved || ((navigator.language||'en').toLowerCase().startsWith('ar')?'ar':'en');
            const originals=new WeakMap();
            const skip='SCRIPT,STYLE,NOSCRIPT,TEXTAREA';
            function translate(){
              document.documentElement.lang=lang;
              document.documentElement.dir=lang==='ar'?'rtl':'ltr';
              const btn=document.getElementById('cvm-locale-toggle');
              if(btn){btn.textContent=lang==='ar'?'English':'العربية';btn.setAttribute('aria-label',lang==='ar'?'Switch to English':'التبديل إلى العربية');}
              const walker=document.createTreeWalker(document.body,NodeFilter.SHOW_TEXT,{acceptNode(n){
                if(!n.nodeValue.trim()||n.parentElement.closest(skip)||n.parentElement.id==='cvm-locale-toggle') return NodeFilter.FILTER_REJECT;
                return NodeFilter.FILTER_ACCEPT;
              }});
              let n;
              while(n=walker.nextNode()){
                if(!originals.has(n)) originals.set(n,n.nodeValue);
                const original=originals.get(n), trimmed=original.trim();
                if(lang==='ar' && translations[trimmed]) { n.nodeValue=original.replace(trimmed,translations[trimmed]); if(n.parentElement && /^(P|H1|H2|H3|H4|LABEL|LI|SPAN|A|BUTTON|OPTION)$/.test(n.parentElement.tagName)){n.parentElement.dir='rtl';n.parentElement.style.textAlign='right';} }
                else { n.nodeValue=original; if(n.parentElement && /^(P|H1|H2|H3|H4|LABEL|LI|SPAN|A|BUTTON|OPTION)$/.test(n.parentElement.tagName)){n.parentElement.dir='ltr';n.parentElement.style.textAlign='';} }
              }
              document.querySelectorAll('input[placeholder],textarea[placeholder],input[aria-label],button[aria-label]').forEach(el=>{
                for(const attr of ['placeholder','aria-label']){
                  if(!el.hasAttribute(attr)) continue;
                  const originalKey='data-cvm-original-'+attr;
                  if(!el.hasAttribute(originalKey)) el.setAttribute(originalKey,el.getAttribute(attr));
                  const original=el.getAttribute(originalKey);
                  el.setAttribute(attr,lang==='ar'?(translations[original]||original):original);
                }
              });
            }
            document.getElementById('cvm-locale-toggle').addEventListener('click',()=>{lang=lang==='ar'?'en':'ar';localStorage.setItem(key,lang);translate();});
            translate();
            new MutationObserver(()=>{if(!window.__cvmLocaleBusy){window.__cvmLocaleBusy=true;requestAnimationFrame(()=>{translate();window.__cvmLocaleBusy=false;});}}).observe(document.body,{childList:true,subtree:true});
          })();
          <\/script>`;
          const insertAt = html.toLowerCase().lastIndexOf('</body>');
          if (insertAt < 0) throw new Error('Could not find closing body tag; refusing to alter source.');
          html = html.slice(0, insertAt) + script + html.slice(insertAt);
          fs.writeFileSync('bilingual-preview.html', html);
          console.log('Preview generated; original production file untouched.');
          console.log('Translation entries: ' + Object.keys(dict).length);
          console.log('Preview bytes: ' + Buffer.byteLength(html));
