name: Show Canadian CV card price only
on:
  push:
    paths:
      - '.github/workflows/fix-canadian-cv-card.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace Canadian card price with direct display
        run: |
          node <<'NODE'
          const fs=require('fs');
          const file='index.html.html';
          let html=fs.readFileSync(file,'utf8');
          const re=/const canadianFallback=s\.id==='canadian-cv'\?[\s\S]*?;const price=s\.id==='canadian-cv'\?[\s\S]*?:canadianFallback;/;
          const replacement="const price=s.id==='canadian-cv'?\x60<div class=\\"service-card-price\\">From \x24{market==='EG'?'EGP 250.00':market==='AE'?'AED 35.00':'SAR 35.00'}</div>\x60:(vals.length?\x60<div class=\\"service-card-price\\">From \x24{formatPrice(Math.min(...vals),market)}</div>\x60:'');";
          if (re.test(html)) {
            html=html.replace(re,replacement);
            fs.writeFileSync(file,html);
            console.log('Canadian CV card now displays its price directly.');
          } else if (html.includes("const price=s.id==='canadian-cv'?\x60<div class=\\"service-card-price\\">From \x24{market==='EG'?'EGP 250.00'")) {
            console.log('Direct Canadian CV card price is already installed.');
          } else {
            throw new Error('Canadian CV card price expression not found; no source changed.');
          }
          NODE
      - name: Commit and push
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html.html
          if git diff --cached --quiet; then echo 'No changes to commit.'; else git commit -m 'Display Canadian CV card price directly' && git push; fi
