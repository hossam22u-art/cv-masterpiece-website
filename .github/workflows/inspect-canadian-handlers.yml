name: Inspect Canadian CV price handlers
on:
  push:
    paths:
      - '.github/workflows/inspect-canadian-handlers.yml'
  workflow_dispatch:
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Locate price preview and order handlers
        run: |
          node <<'NODE'
          const fs=require('fs');const h=fs.readFileSync('index.html.html','utf8');
          const needles=['pricePreview','orderOption','orderCountry','orderLanguage','function refresh','function update','function openOrder','getPrice(','addEventListener("change"','addEventListener(\'change\''];
          for(const needle of needles){let i=h.indexOf(needle);console.log('\n### '+needle+' @ '+i);if(i>=0)console.log(h.slice(Math.max(0,i-700),Math.min(h.length,i+2600)));}
          NODE