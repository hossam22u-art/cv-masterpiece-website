name: Inspect CV pricing controls
on:
  push:
    paths:
      - '.github/workflows/inspect-cv-pricing.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect relevant HTML snippets
        run: |
          node <<'NODE'
          const fs=require('fs'); const h=fs.readFileSync('index.html.html','utf8');
          console.log('HTML_LENGTH',h.length);
          for (const term of ['Canadian','ATS CV','countrySelect','orderCountry','serviceSelect','price','Europass']) {
            const re=new RegExp(term,'ig'); let m,n=0;
            while((m=re.exec(h)) && n<8) {
              console.log('TERM',term,'AT',m.index, h.slice(Math.max(0,m.index-500),Math.min(h.length,m.index+1000)).replace(/\s+/g,' '));
              n++;
            }
          }
          console.log('SELECTS', [...h.matchAll(/<select\b[^>]*>/gi)].slice(0,20).map(x=>x[0]).join('\n'));
          console.log('OPTIONS', [...h.matchAll(/<option\b[^>]*>[^<]{0,120}<\/option>/gi)].slice(0,100).map(x=>x[0]).join('\n'));
          NODE