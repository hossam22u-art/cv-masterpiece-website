name: Fix Canadian CV price on deployed homepage
on:
  push:
    paths:
      - '.github/workflows/fix-canadian-card-live-file.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch the actual index.html service-card renderer
        run: |
          node <<'NODE'
          const fs = require('fs');
          const file = 'index.html';
          let html = fs.readFileSync(file, 'utf8');
          const oldCode = "const vals=Object.entries(s.prices||{}).filter(([k,v])=>k.startsWith(market+'|')&&v!==null).map(([k,v])=>Number(v));";
          const newCode = "const canadianCardPrices={EG:250,AE:35,SA:35};const vals=s.id==='canadian-cv'?(canadianCardPrices[market]!==undefined?[canadianCardPrices[market]]:[]):Object.entries(s.prices||{}).filter(([k,v])=>k.startsWith(market+'|')&&v!==null).map(([k,v])=>Number(v));";
          if (html.includes(oldCode)) {
            html = html.replace(oldCode, newCode);
            fs.writeFileSync(file, html);
            console.log('Patched deployed index.html Canadian CV card starting price.');
          } else if (html.includes(newCode)) {
            console.log('Deployed index.html already has the Canadian CV card price patch.');
          } else {
            throw new Error('Could not find the exact live service-card price renderer. No changes made.');
          }
          NODE
      - name: Commit homepage fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then echo 'No homepage changes.'; else git commit -m 'Show Canadian CV starting price on deployed homepage' && git push; fi
