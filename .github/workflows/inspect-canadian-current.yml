name: Inspect Canadian CV price configuration
on:
  push:
    paths:
      - '.github/workflows/inspect-canadian-current.yml'
  workflow_dispatch:
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Print Canadian CV configuration and price lookup
        run: |
          node <<'NODE'
          const fs=require('fs');const h=fs.readFileSync('index.html.html','utf8');
          for(const needle of ['"id":"canadian-cv"','function getPrice','function formatPrice','Request a quote']){const i=h.indexOf(needle);console.log('\n### '+needle+' @ '+i);if(i>=0)console.log(h.slice(Math.max(0,i-350),Math.min(h.length,i+1800)));}
          NODE