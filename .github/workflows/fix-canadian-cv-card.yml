name: Show Canadian CV card price only
on:
  push:
    paths:
      - '.github/workflows/fix-canadian-cv-card.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace Canadian card price with direct display
        run: |
          node <<'NODE'
          const fs=require('fs');
          const file='index.html.html';
          let html=fs.readFileSync(file,'utf8');
          const bt=String.fromCharCode(96);
          const card=bt+"<div class='service-card-price'>From ${market==='EG'?'EGP 250.00':market==='AE'?'AED 35.00':'SAR 35.00'}</div>"+bt;
          const normal=bt+"<div class='service-card-price'>From ${formatPrice(Math.min(...vals),market)}</div>"+bt;
          const replacement="const price=s.id==='canadian-cv'?"+card+":(vals.length?"+normal+":'');";
          const re=/const canadianFallback=s\.id==='canadian-cv'\?[\s\S]*?;const price=s\.id==='canadian-cv'\?[\s\S]*?:canadianFallback;/;
          if(re.test(html)){html=html.replace(re,replacement);fs.writeFileSync(file,html);console.log('Canadian CV card price replaced with direct display.');}
          else if(html.includes(replacement)){console.log('Direct price already present.');}
          else throw new Error('Canadian card price expression not found.');
          NODE
      - name: Commit and push
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html.html
          if git diff --cached --quiet; then echo 'No changes to commit.'; else git commit -m 'Display Canadian CV card price directly' && git push; fi
