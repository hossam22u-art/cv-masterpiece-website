name: Fix Canadian CV order pricing fallback
on:
  push:
    paths:
      - '.github/workflows/fix-canadian-order-pricing.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add explicit Canadian CV prices to order calculator
        run: |
          node <<'NODE'
          const fs=require('fs');const file='index.html.html';let h=fs.readFileSync(file,'utf8');
          const old='return null} function formatPrice(v,country)';
          const replacement="if(serviceId==='canadian-cv'){const marketPrices={EG:{English:250,French:350,'Other languages':350},AE:{English:35,French:45,'Other languages':45},SA:{English:35,French:45,'Other languages':45}};const fallback=marketPrices[country]?.[language];if(fallback!==undefined)return fallback}return null} function formatPrice(v,country)";
          if(h.includes(replacement)){console.log('Canadian order price fallback already exists.');}
          else if(h.includes(old)){h=h.replace(old,replacement);console.log('Inserted Canadian CV fallback into getPrice().');}
          else throw new Error('Could not locate exact getPrice() insertion point; no change made.');
          fs.writeFileSync(file,h);
          NODE
      - name: Remove temporary inspection workflows
        run: rm -f .github/workflows/inspect-order-modal-price.yml .github/workflows/inspect-canadian-card.yml
      - name: Commit and push
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html.html .github/workflows
          git commit -m 'Fix Canadian CV order price calculation'
          git push