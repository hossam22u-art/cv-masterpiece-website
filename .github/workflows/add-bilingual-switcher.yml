name: Refine bilingual language switcher
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/add-bilingual-switcher.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  refine-language-switcher:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Move switcher into header and protect brand name
        run: |
          python - <<'PY'
          from pathlib import Path
          injection = r"""
          <style id="cvm-language-style">
          #cvm-language-switcher{position:static;display:inline-flex;flex:0 0 auto;align-items:center;gap:3px;padding:4px;background:#111;border:1px solid #b51f2b;border-radius:999px;box-shadow:0 3px 12px #0002;font-family:Arial,sans-serif;margin-inline-end:10px;white-space:nowrap}
          #cvm-language-switcher button{border:0;border-radius:999px;padding:7px 11px;background:transparent;color:#fff;font-weight:700;cursor:pointer;font-size:12px;line-height:1.2}
          #cvm-language-switcher button.active{background:#c51f32;color:#fff}
          .top-actions #cvm-language-switcher{order:-1}
          @media(max-width:760px){.top-actions #cvm-language-switcher{margin:6px 0}.top-actions{flex-wrap:wrap}}
          html[dir="rtl"] body{direction:rtl;text-align:right}
          html[dir="rtl"]{direction:rtl}
          .goog-te-banner-frame.skiptranslate{display:none!important}
          body{top:0!important}
          #google_translate_element{position:fixed;left:-9999px;top:-9999px}
          </style>
          <div id="google_translate_element"></div>
          <script>
          (function(){
            var switcher=document.createElement('div');
            switcher.id='cvm-language-switcher';
            switcher.setAttribute('aria-label','Choose language');
            switcher.innerHTML='<button type="button" data-lang="ar">العربية</button><button type="button" data-lang="en" class="active">English</button>';
            var target=document.querySelector('.top-actions')||document.querySelector('.topbar')||document.querySelector('header');
            if(target){target.insertBefore(switcher,target.firstChild)}
            var buttons=switcher.querySelectorAll('button');
            function setDirection(lang){
              document.documentElement.setAttribute('lang',lang);
              document.documentElement.setAttribute('dir',lang==='ar'?'rtl':'ltr');
              document.body.setAttribute('dir',lang==='ar'?'rtl':'ltr');
              buttons.forEach(function(b){b.classList.toggle('active',b.getAttribute('data-lang')===lang)});
            }
            function protectBrand(){
              document.querySelectorAll('.brand,.brand-name,[aria-label*="CV Masterpiece"],[alt*="CV Masterpiece"]').forEach(function(el){el.setAttribute('translate','no');el.classList.add('notranslate')});
              var walker=document.createTreeWalker(document.body,NodeFilter.SHOW_TEXT);
              var nodes=[];while(walker.nextNode())if(/CV Masterpiece|CV MASTERPIECE/i.test(walker.currentNode.nodeValue))nodes.push(walker.currentNode);
              nodes.forEach(function(node){
                if(node.parentElement.closest('script,style,textarea,input,.notranslate,[translate="no"]'))return;
                var re=/(CV Masterpiece|CV MASTERPIECE)/ig, frag=document.createDocumentFragment(),last=0,m;
                while((m=re.exec(node.nodeValue))){frag.appendChild(document.createTextNode(node.nodeValue.slice(last,m.index)));var span=document.createElement('span');span.className='notranslate';span.setAttribute('translate','no');span.textContent=m[0];frag.appendChild(span);last=re.lastIndex}
                frag.appendChild(document.createTextNode(node.nodeValue.slice(last)));node.parentNode.replaceChild(frag,node);
              });
              var title=document.querySelector('title');if(title)title.setAttribute('translate','no');
            }
            function translateTo(lang){
              setDirection(lang);protectBrand();
              var combo=document.querySelector('.goog-te-combo');
              if(combo){combo.value=lang;combo.dispatchEvent(new Event('change'))}
              try{localStorage.setItem('cvm_site_language',lang)}catch(e){}
            }
            buttons.forEach(function(b){b.addEventListener('click',function(){translateTo(b.getAttribute('data-lang'))})});
            window.googleTranslateElementInit=function(){
              new google.translate.TranslateElement({pageLanguage:'en',includedLanguages:'ar,en',autoDisplay:false},'google_translate_element');
              protectBrand();
              var saved='en';try{saved=localStorage.getItem('cvm_site_language')||'en'}catch(e){}
              if(saved==='ar')setTimeout(function(){translateTo('ar')},700);else setDirection('en');
            };
            var s=document.createElement('script');s.src='https://translate.google.com/translate_a/element.js?cb=googleTranslateElementInit';s.async=true;document.head.appendChild(s);
          })();
          </script>
          """
          for name in ('index.html','index.html.html'):
              p=Path(name)
              if not p.exists(): continue
              data=p.read_text(encoding='utf-8')
              # Replace the prior fixed switcher block, if present.
              start=data.find('<style id="cvm-language-style">')
              if start>=0:
                  end=data.find('</script>',start)
                  if end<0: raise SystemExit('Could not find end of old language switcher')
                  end+=len('</script>')
                  data=data[:start]+data[end:]
              if 'cvm-language-switcher' not in data or start>=0:
                  idx=data.lower().rfind('</body>')
                  if idx<0: raise SystemExit(f'No body end in {name}')
                  data=data[:idx]+injection+'\\n'+data[idx:]
              p.write_text(data,encoding='utf-8')
          PY
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html index.html.html
          git commit -m "Move language switcher into header and protect brand name"
          git push
