name: Inspect order modal price calculation
on:
  push:
    paths:
      - '.github/workflows/inspect-order-modal-price.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect price lookup code
        run: |
          node <<'NODE'
          const fs=require('fs');const h=fs.readFileSync('index.html.html','utf8');
          for(const term of ['No approved price is configured','Request a quote','estimatedPrice','priceKey','service.prices','selectedLanguage','languageSelect','orderPrice','getServicePrice']){let i=-1,n=0;while((i=h.indexOf(term,i+1))>=0&&n<5){console.log('\n### '+term+' @ '+i+'\n'+h.slice(Math.max(0,i-1200),Math.min(h.length,i+2200)).replace(/\s+/g,' '));n++;}}
          NODE