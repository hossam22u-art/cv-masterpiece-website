name: Diagnose Canadian CV card price renderer
on:
  push:
    paths:
      - '.github/workflows/diagnose-canadian-cv-card.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Print Canadian CV service and price rendering context
        run: |
          node <<'NODE'
          const fs=require('fs');
          const h=fs.readFileSync('index.html.html','utf8');
          for (const term of ['canadian-cv','service-card-price','formatPrice(']) {
            console.log('\\n===== '+term+' =====');
            let p=-1,n=0;
            while((p=h.indexOf(term,p+1))>=0 && n<12){
              console.log('--- occurrence '+(++n)+' at '+p+' ---');
              console.log(h.slice(Math.max(0,p-500),Math.min(h.length,p+900)).replace(/\\s+/g,' '));
            }
          }
          NODE
