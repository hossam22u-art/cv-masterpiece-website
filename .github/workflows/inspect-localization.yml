name: Inspect website localization safely
on:
  push:
    paths:
      - '.github/workflows/inspect-localization.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect HTML without modifying it
        run: |
          node <<'NODE'
          const fs = require('fs');
          const h = fs.readFileSync('index.html.html','utf8');
          const strip = s => s.replace(/<script\\b[^>]*>[\\s\\S]*?<\\/script>/gi,' ').replace(/<style\\b[^>]*>[\\s\\S]*?<\\/style>/gi,' ').replace(/<!--[\\s\\S]*?-->/g,' ');
          const visible = strip(h);
          const texts = [...visible.matchAll(/>([^<>]{2,180})</g)].map(m=>m[1].replace(/\\s+/g,' ').trim()).filter(s=>s && /[A-Za-z]/.test(s));
          const unique = [...new Set(texts)];
          const attrs = [...h.matchAll(/(?:placeholder|aria-label|title|alt)\\s*=\\s*["']([^"']{2,100})["']/gi)].map(m=>m[1].trim()).filter(s=>/[A-Za-z]/.test(s));
          console.log('HTML_BYTES=' + Buffer.byteLength(h));
          console.log('LANG=' + (h.match(/<html[^>]*>/i)||['not found'])[0]);
          console.log('BODY_OPEN=' + (h.match(/<body[^>]*>/i)||['not found'])[0]);
          console.log('FORM_COUNT=' + (h.match(/<form\\b/gi)||[]).length);
          console.log('BUTTON_COUNT=' + (h.match(/<button\\b/gi)||[]).length);
          console.log('INPUT_COUNT=' + (h.match(/<input\\b/gi)||[]).length);
          console.log('SELECT_COUNT=' + (h.match(/<select\\b/gi)||[]).length);
          console.log('SCRIPT_COUNT=' + (h.match(/<script\\b/gi)||[]).length);
          console.log('VISIBLE_ENGLISH_TEXTS=' + unique.length);
          console.log('ATTRIBUTE_ENGLISH_TEXTS=' + attrs.length);
          console.log('---TEXT SAMPLE---');
          console.log(unique.slice(0,240).join(' | '));
          console.log('---ATTRIBUTES---');
          console.log([...new Set(attrs)].slice(0,100).join(' | '));
          NODE