name: Repair Canadian CV pricing script syntax
on:
  push:
    paths:
      - '.github/workflows/repair-canadian-price-syntax.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Repair duplicated function declaration
        run: |
          node <<'NODE'
          const fs = require('fs');
          const file = 'index.html.html';
          let html = fs.readFileSync(file, 'utf8');
          const broken = 'function formatPricefunction formatPrice(';
          const fixed = 'function formatPrice(';
          if (html.includes(broken)) {
            html = html.replace(broken, fixed);
            console.log('Repaired the duplicated function declaration.');
          } else {
            console.log('The suspected duplicated declaration was not found; checking script syntax only.');
          }
          const scriptTagStart = html.indexOf('<script');
          if (scriptTagStart < 0) throw new Error('Script tag not found.');
          const scriptStart = html.indexOf('>', scriptTagStart) + 1;
          const scriptEnd = html.indexOf('</script>', scriptStart);
          if (scriptStart <= 0 || scriptEnd < 0) throw new Error('Could not extract the main script.');
          new Function(html.slice(scriptStart, scriptEnd));
          fs.writeFileSync(file, html);
          console.log('Main script syntax check passed.');
          NODE
      - name: Commit repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html.html
          if git diff --cached --quiet; then
            echo "No source changes to commit."
          else
            git commit -m "Repair pricing script syntax"
            git push
          fi
