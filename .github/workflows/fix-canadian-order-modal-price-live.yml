name: Fix Canadian CV price in order modal and submitted order
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/fix-canadian-order-modal-price-live.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch the live order price lookup only for Canadian CV
        run: |
          node <<'NODE'
          const fs=require('fs');const file='index.html';let html=fs.readFileSync(file,'utf8');
          const marker='cvm-canadian-order-price-live-v1';
          const anchor='const s=db.services.find(x=>x.id===serviceId);if(!s)return null;const keys=';
          if(!html.includes(marker)){
            const count=html.split(anchor).length-1;
            if(count!==1) throw new Error('Expected exactly one live order price lookup anchor; found '+count+'. No change made.');
            const guard=`/* ${marker} */
          if(serviceId==='canadian-cv'){
            const english={EG:250,AE:35,SA:35};
            const other={EG:350,AE:45,SA:45};
            if(['EG','AE','SA'].includes(country)) return language==='English'?english[country]:other[country];
            return null;
          }
          `;
            html=html.replace(anchor,guard+anchor);
          }
          if(!html.includes(marker)) throw new Error('Canadian order price patch validation failed.');
          fs.writeFileSync(file,html);console.log('Live Canadian CV order price lookup patched and validated.');
          NODE
      - name: Commit and push
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then echo 'No changes'; else git commit -m 'Fix Canadian CV order modal pricing'; git push; fi
