name: Connect hosted CV templates
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/connect-hosted-templates.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-template-links:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Update template links
        run: |
          python - <<'PY'
          from pathlib import Path

          english_old = 'href="CV_Masterpiece_All_Sections_Red_Black_AI%20(7).html"'
          english_new = 'href="https://fast-oreo-369.rehost.page/CV_Masterpiece_All_Sections_Red_Black_AI%20(7).html"'
          arabic_old = 'href="CV_Masterpiece_Arabic_Templates_Only.html"'
          arabic_new = 'href="https://less-hank-317.rehost.page/CV_Masterpiece_Arabic_Templates_Only.html"'
          note_old = 'For these links to work after publishing, upload both template HTML files alongside the main CV Masterpiece website in the same hosting folder.'
          note_new = 'Browse the English and Arabic CV template collections online.'
          
          changed = []
          for filename in ('index.html', 'index.html.html'):
              path = Path(filename)
              if not path.exists():
                  continue
              text = path.read_text(encoding='utf-8')
              before = text
              text = text.replace(english_old, english_new)
              text = text.replace(arabic_old, arabic_new)
              text = text.replace(note_old, note_new)
              if text != before:
                  path.write_text(text, encoding='utf-8')
                  changed.append(filename)
          if not changed:
              raise SystemExit('No matching template links were found; nothing was committed.')
          print('Updated:', ', '.join(changed))
          PY

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html index.html.html
          git commit -m "Connect Arabic and English CV template links"
          git push
