name: Force Canadian CV card starting price
on:
  push:
    paths:
      - '.github/workflows/fix-canadian-cv-card.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Force price directly on Canadian CV service card
        run: |
          node <<'NODE'
          const fs = require('fs');
          const file = 'index.html.html';
          let html = fs.readFileSync(file, 'utf8');
          const old = "const canadianFallback=s.id==='canadian-cv'?\x60<div class=\\\"service-card-price\\\">From \x24{formatPrice(market==='EG'?250:market==='AE'?35:35,market)}</div>\x60:'';const price=vals.length?\x60<div class=\\\"service-card-price\\\">From \x24{formatPrice(Math.min(...vals),market)}</div>\x60:canadianFallback;";
          const replacement = "const price=s.id==='canadian-cv'?\x60<div class=\\\"service-card-price\\\">From \x24{formatPrice(market==='EG'?250:market==='AE'?35:35,market)}</div>\x60:vals.length?\x60<div class=\\\"service-card-price\\\">From \x24{formatPrice(Math.min(...vals),market)}</div>\x60:'';";
          if (html.includes(replacement)) {
            console.log('Canadian CV card already uses the forced starting price.');
          } else if (html.includes(old)) {
            html = html.replace(old, replacement);
            console.log('Canadian CV card now always renders its starting price.');
          } else {
            const simpleOld = "const price=vals.length?\x60<div class=\\\"service-card-price\\\">From \x24{formatPrice(Math.min(...vals),market)}</div>\x60:'';";
            const simpleReplacement = "const price=s.id==='canadian-cv'?\x60<div class=\\\"service-card-price\\\">From \x24{formatPrice(market==='EG'?250:market==='AE'?35:35,market)}</div>\x60:vals.length?\x60<div class=\\\"service-card-price\\\">From \x24{formatPrice(Math.min(...vals),market)}</div>\x60:'';";
            if (html.includes(simpleOld)) html = html.replace(simpleOld, simpleReplacement);
            else throw new Error('Could not safely locate Canadian CV card price renderer. No changes made.');
          }
          fs.writeFileSync(file, html);
          NODE
      - name: Commit website fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html.html
          if git diff --cached --quiet; then echo 'No changes to commit.'; else git commit -m 'Force Canadian CV card starting price' && git push; fi
