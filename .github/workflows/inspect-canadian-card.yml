name: Inspect Canadian CV card rendering
on:
  push:
    paths:
      - '.github/workflows/inspect-canadian-card.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Locate Canadian CV rendering references
        run: |
          node <<'NODE'
          const fs=require('fs');const h=fs.readFileSync('index.html.html','utf8');
          for(const term of ['Canadian CV / Resume','canadian-cv','Explore service','cv-type-price','service-card']) {
            let i=-1,n=0;while((i=h.indexOf(term,i+1))>=0&&n<20){console.log('\nTERM',term,'AT',i,'\n',h.slice(Math.max(0,i-700),Math.min(h.length,i+1100)).replace(/\\s+/g,' '));n++;}
          }
          NODE